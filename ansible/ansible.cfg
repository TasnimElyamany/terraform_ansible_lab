[defaults]
inventory          = ./inventory/hosts.ini
remote_user        = root
host_key_checking  = False          # disable for lab — enable in production!
retry_files_enabled = False
stdout_callback    = yaml           # cleaner output for teaching

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True                   # speeds up playbook execution
