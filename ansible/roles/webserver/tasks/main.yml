---

- name: Update apt package cache
  apt:
    update_cache: yes
    cache_valid_time: 3600      
  tags: packages

- name: Install required packages
  apt:
    name:
      - nginx
      - curl
      - git
    state: present              
  notify: restart nginx
  tags: packages

- name: Create web root directory
  file:
    path: /var/www/html
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags: config

- name: Deploy custom index page from template
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    group: www-data
    mode: "0644"
  notify: restart nginx         
  tags: deploy

- name: Deploy Nginx virtual host config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/lab
    mode: "0644"
  notify: restart nginx
  tags: config

- name: Enable the virtual host
  file:
    src: /etc/nginx/sites-available/lab
    dest: /etc/nginx/sites-enabled/lab
    state: link
  notify: restart nginx
  tags: config

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx
  tags: config

- name: Ensure Nginx is started and enabled on boot
  service:
    name: nginx
    state: started
    enabled: yes
  tags: service
